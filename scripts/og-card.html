<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: italic;
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-italic.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Inter Tight";
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2")
          format("woff2");
      }
      html,
      body {
        margin: 0;
      }
      .card {
        display: flex;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        color: #16161a;
        font-family: "Newsreader", Georgia, serif;
      }
      .text {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 56px 56px 72px;
        border-top: 12px solid #8a1c2b;
      }
      .label {
        font-family: "Inter Tight", sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a1c2b;
      }
      h1 {
        margin: 0;
        font-size: 66px;
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }
      em {
        color: #8a1c2b;
      }
      .name {
        font-family: "Inter Tight", sans-serif;
        font-size: 26px;
        font-weight: 600;
      }
      img {
        display: block;
        width: 440px;
        height: 630px;
        object-fit: cover;
        object-position: 50% 30%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="label">Data &amp; AI architect</div>
        <h1>PostgreSQL at scale.<br />AI in <em>production.</em></h1>
        <div class="name">Shayon Sanyal</div>
      </div>
      <img src="../src/assets/portrait.jpg" alt="" />
    </div>
  </body>
</html>
